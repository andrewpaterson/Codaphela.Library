# A copy of HCP65/Website/mkdocs.yml (2026-11-24) with the extra.sources map DocsPlan.txt decision 13 describes.
site_name: Codaphela
site_description: The HCP65 modern home computer, its C++ compiler, the 65C64 microprocessor proposal, the C++ software libraries and the HCP65 drivers and runtime
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  - privacy
  - glightbox
  - table-reader

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - ../Tests/TestAssembler65Lib/TestAssembler65Lib/Input
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - HCP65 Modern Home Computer:
      - hcp65/index.md
      - Memory Map: hcp65/memory-map.md
      - Memory Management: hcp65/memory.md
      - Kernel Calls: hcp65/kernel-calls.md
      - On-board Registers: hcp65/registers.md
      - Devices and Main Memory: hcp65/devices.md
      - Starting Up: hcp65/boot.md
      - The Console and the Shell: hcp65/console.md
      - The Screen: hcp65/screen.md
      - Sprites: hcp65/sprites.md
      - Drivers and Runtime:
          - hcp65/runtime/index.md
          - W65C816 Runtime: hcp65/runtime/w65c816.md
      - Emulator: hcp65/emulator.md
  - HCP65 C++ Compiler:
